[project]
name = "research-agent-rag"
version = "0.1.0"
description = "Research Paper Assistant with On-the-fly Ingestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration & LLMs
    "langgraph>=0.1.19",
    "langchain>=0.2.6",
    "langchain-openai>=0.1.14",
    "langchain-anthropic>=0.1.19",
    # Ingestion & Parsing
    "arxiv>=2.1.3",
    "pylatexenc>=2.10",
    "pymupdf>=1.24.7",
    # Vector DB & Embeddings/Reranking
    "qdrant-client>=1.10.1",
    "fastembed>=0.3.1",
    # UI & Backend
    "chainlit>=1.1.306",
    # Utils
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "ruff>=0.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
